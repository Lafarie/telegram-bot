<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        
        .form-fieldset {
            @apply mb-6 pb-6 border-b border-gray-200 last:border-b-0;
        }
        
        .form-fieldset legend {
            @apply block text-lg font-semibold text-gray-900 mb-3;
        }
        
        .required::after {
            content: " *";
            @apply text-red-500 font-bold;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        textarea,
        select {
            @apply w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition;
        }
        
        textarea {
            @apply resize-vertical min-h-[120px];
        }
        
        .form-control {
            @apply w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent;
        }
        
        .btn-submit {
            @apply w-full py-3 px-6 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold rounded-lg hover:from-blue-700 hover:to-indigo-700 transition-all duration-200 shadow-md hover:shadow-lg cursor-pointer;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen py-8 px-4">
    <div class="max-w-3xl mx-auto">
        <!-- Header Card -->
        <div class="bg-white rounded-t-2xl shadow-lg overflow-hidden mb-0">
            <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-8">
                <h1 class="text-3xl font-bold text-white mb-2">Contact Information</h1>
                <p class="text-blue-100 text-sm">Please fill out this form to get in touch with us</p>
            </div>
        </div>

        <!-- Form Card -->
        <form 
            action="https://docs.google.com/forms/d/e/1FAIpQLSdUnr7VMWbGYQZIsDwMV8zwSmnQeQKNPz-ipS0rIuuU9o17YA/formResponse"
            method="POST"
            class="bg-white rounded-b-2xl shadow-lg p-8 space-y-8">

            <!-- Name Field -->
            <fieldset class="form-fieldset">
                <legend class="required">Name</legend>
                <div class="form-group">
                    <input 
                        id="name"
                        type="text" 
                        name="entry.2005620554" 
                        class="form-control" 
                        placeholder="Enter your full name"
                        required>
                </div>
            </fieldset>

            <!-- Email Field -->
            <fieldset class="form-fieldset">
                <legend class="required">Email</legend>
                <div class="form-group">
                    <input 
                        id="email"
                        type="email" 
                        name="entry.1045781291" 
                        class="form-control" 
                        placeholder="your.email@example.com"
                        required>
                </div>
            </fieldset>

            <!-- Address Field -->
            <fieldset class="form-fieldset">
                <legend class="required">Address</legend>
                <div class="form-group">
                    <textarea 
                        id="address"
                        name="entry.1065046570" 
                        class="form-control" 
                        placeholder="Enter your street address, city, state, zip"
                        required></textarea>
                </div>
            </fieldset>

            <!-- Phone Field -->
            <fieldset class="form-fieldset">
                <legend>Phone number</legend>
                <div class="form-group">
                    <input 
                        id="phone"
                        type="tel" 
                        name="entry.1166974658" 
                        class="form-control" 
                        placeholder="+1 (555) 123-4567">
                </div>
            </fieldset>

            <!-- Comments Field -->
            <fieldset class="form-fieldset">
                <legend>Comments</legend>
                <div class="form-group">
                    <textarea 
                        id="comments"
                        name="entry.839337160" 
                        class="form-control" 
                        placeholder="Add any additional comments or questions"></textarea>
                </div>
            </fieldset>

            <!-- Hidden Fields -->
            <input type="hidden" name="fvv" value="1">
            <input type="hidden" name="fbzx" value="8861785682619486580">
            <input type="hidden" name="pageHistory" value="0">

            <!-- Submit Button -->
            <button type="submit" class="btn-submit">
                Submit
            </button>

            <!-- Info Text -->
            <p class="text-xs text-gray-500 text-center">
                📤 Generated on March 20, 2026
            </p>
        </form>

        <!-- Footer Info -->
        <div class="mt-6 text-center text-sm text-gray-600">
            <p>🤖 Converted by Telegram Bot</p>
            <p class="text-xs mt-2">
                <a href="https://docs.google.com/forms/d/e/1FAIpQLSdUnr7VMWbGYQZIsDwMV8zwSmnQeQKNPz-ipS0rIuuU9o17YA/viewform" target="_blank" class="text-blue-600 hover:underline">
                    View original form →
                </a>
            </p>
        </div>
    </div>
</body>
</html>
